<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>かけはしラボ</title>
  <meta name="theme-color" content="#0E7C66" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button type="button" class="back" id="open-stage-select" aria-label="ステージ選択">ステージ</button>
      <div class="stage-title">
        <span class="stage-chapter" id="stage-chapter"></span>
        <span class="stage-name" id="stage-name"></span>
      </div>
      <span class="badge" id="mode-badge" hidden>試験中</span>
      <div class="spacer"></div>
      <div class="budget">
        <div class="budget-label"><span>使った金額</span><span><b id="cost">¥0</b> / <span id="budget"></span></span></div>
        <div class="meter"><div class="meter-fill" id="cost-meter"></div></div>
      </div>
      <label class="vehicle">
        <span>わたる車</span>
        <select id="vehicle"></select>
      </label>
    </header>

    <div class="workspace">
      <aside class="panel tools-panel" id="tools-panel">
        <button type="button" class="drawer-close" data-close-drawer>とじる</button>
        <section>
          <h2>材料</h2>
          <div class="choice-grid" id="materials"></div>
        </section>
        <section>
          <h2>断面</h2>
          <div class="choice-list" id="sections"></div>
        </section>
        <section>
          <h2>道具</h2>
          <div class="choice-grid" id="tools"></div>
        </section>
      </aside>

      <main class="canvas-area">
        <canvas id="canvas"></canvas>
        <div class="toast" id="toast" hidden></div>
      </main>

      <aside class="panel info-panel" id="info-panel">
        <button type="button" class="drawer-close" data-close-drawer>とじる</button>
        <section>
          <h2>いちばん苦しい部材の負担率</h2>
          <div class="big-number"><span id="max-util">--</span><span class="unit">%</span></div>
          <div class="meter tall"><div class="meter-fill danger" id="util-meter"></div></div>
          <div class="meter-scale"><span>0%</span><span>目安 70%</span><span>100% でこわれる</span></div>
          <p class="meter-note">負担率は、部材がたえられる力のうち、どれだけ使っているかを表すよ。</p>
        </section>
        <section class="member-info" id="member-info" hidden></section>
        <section class="result" id="result" hidden></section>
        <section class="legend">
          <h2>色の見かた</h2>
          <div class="legend-row"><span class="swatch tension"></span><span><b>青</b>＝引っぱられる（引張）</span></div>
          <div class="legend-row"><span class="swatch compression"></span><span><b>赤</b>＝押される（圧縮）</span></div>
          <div class="legend-row"><span class="arrow-sample compression">▶━◀</span><span>矢印が内向き＝押される</span></div>
          <div class="legend-row"><span class="arrow-sample tension">◀━▶</span><span>矢印が外向き＝引っぱられる</span></div>
          <div class="legend-note">色がこく、矢印が大きいほど力が大きい</div>
        </section>
      </aside>
    </div>

    <div class="rotate-notice">
      <div class="rotate-icon" aria-hidden="true">📱↻</div>
      <p>スマホを<b>横向き</b>にして遊んでね</p>
    </div>

    <div class="overlay" id="stage-select" hidden>
      <div class="overlay-box">
        <div class="overlay-header">
          <h1>かけはしラボ</h1>
          <a class="teacher-link" href="./teacher.html" target="_blank" rel="noopener">先生用ページ</a>
        </div>
        <p class="lead">谷に橋をかけて、車を安全にわたらせよう。どのステージから始めてもいいよ。</p>
        <div class="stage-list" id="stage-list"></div>
      </div>
    </div>

    <footer class="bottombar">
      <div class="edit-actions">
        <!-- スマホを横にしたときだけ出す、左右のパネルを開くボタン -->
        <button type="button" class="drawer-toggle" id="open-tools">材料と道具<small id="tools-summary"></small></button>
        <button type="button" class="tool" id="undo" title="Ctrl + Z でももどせます">もどす</button>
        <button type="button" class="tool" id="clear">はじめから</button>
        <button type="button" class="tool" id="load-sample">お手本を置く</button>
      </div>
      <div class="hint" id="hint">道具「つなぐ」で、点から点へなぞって部材を置こう。</div>
      <div class="test-actions">
        <button type="button" class="drawer-toggle" id="open-info">負担率<b>--%</b></button>
        <button type="button" class="secondary" id="predict" aria-pressed="false">力を予想する</button>
        <button type="button" class="primary" id="run-test">試験スタート</button>
      </div>
    </footer>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
